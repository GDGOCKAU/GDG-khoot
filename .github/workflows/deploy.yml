name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# one deploy at a time; a newer push waits for the running one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/gdgockau/gdg-khoot-api
  WEB_IMAGE: ghcr.io/gdgockau/gdg-khoot-web

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Frontend - install
        run: npm ci
      - name: Frontend - lint
        run: npm run lint
      - name: Frontend - build
        run: npm run build

      - name: Backend - install
        working-directory: backend
        run: npm ci
      - name: Backend - prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Backend - test
        working-directory: backend
        run: npm test
      - name: Backend - build
        working-directory: backend
        run: npm run build

  images:
    name: Build and push images
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to server
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/kauhoot' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Copy docker-compose.yml
        run: |
          ssh target "mkdir -p $DEPLOY_PATH"
          scp docker-compose.yml "target:$DEPLOY_PATH/docker-compose.yml"

      - name: Pull new images and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          ssh target bash -s <<EOF
          set -e
          cd $DEPLOY_PATH
          test -f .env || { echo "Missing $DEPLOY_PATH/.env on the server"; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export API_IMAGE=$API_IMAGE:$TAG WEB_IMAGE=$WEB_IMAGE:$TAG
          docker compose pull api web
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          echo "waiting for the API..."
          for i in \$(seq 1 40); do
            if docker compose exec -T web wget -qO- http://127.0.0.1/health >/dev/null 2>&1; then
              echo "healthy"; docker compose ps; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy:"; docker compose ps; docker compose logs --tail 60 api
          exit 1
          EOF
